name: Publish release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate publishing configuration
    runs-on: ubuntu-latest
    outputs:
      release-matrix: ${{ steps.matrix.outputs.matrix }}
    env:
      MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}
      CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
      CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
    steps:
      - name: Check variables and secrets
        shell: bash
        run: |
          missing=()
          [[ -n "$MODRINTH_PROJECT_ID" ]] || missing+=("variable MODRINTH_PROJECT_ID")
          [[ -n "$CURSEFORGE_PROJECT_ID" ]] || missing+=("variable CURSEFORGE_PROJECT_ID")
          [[ -n "$MODRINTH_TOKEN" ]] || missing+=("secret MODRINTH_TOKEN")
          [[ -n "$CURSEFORGE_TOKEN" ]] || missing+=("secret CURSEFORGE_TOKEN")

          if (( ${#missing[@]} )); then
            printf 'Missing repository configuration: %s\n' "${missing[@]}"
            exit 1
          fi

      - name: Check out release tag
        uses: actions/checkout@v4

      - name: Generate the publishing matrix
        id: matrix
        shell: bash
        run: |
          matrix='[]'
          while IFS= read -r minecraft; do
            properties="versions/$minecraft/gradle.properties"
            fabric_api="$(sed -n 's/^fabric_api_version=//p' "$properties")"
            java="$(sed -n 's/^java_dependency=>=//p' "$properties")"

            if [[ -z "$fabric_api" || -z "$java" ]]; then
              echo "Cannot read publishing metadata from $properties"
              exit 1
            fi

            matrix="$(jq -c \
              --arg minecraft "$minecraft" \
              --arg fabric_api "$fabric_api" \
              --arg java "$java" \
              '. + [{minecraft: $minecraft, fabric_api: $fabric_api, java: $java}]' \
              <<< "$matrix")"
          done < <(jq -r '.versions[]' settings.json)

          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    name: Build release jars
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.release.outputs.version }}
      version-type: ${{ steps.release.outputs.version-type }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Read release metadata
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          version="${RELEASE_TAG#v}"
          if [[ ! "$version" =~ ^[0-9A-Za-z][0-9A-Za-z._+-]*$ ]]; then
            echo "Release tag '$RELEASE_TAG' is not a supported version tag."
            echo "Use a tag such as v1.1.0 or v1.1.0-beta.1."
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            echo "version-type=beta" >> "$GITHUB_OUTPUT"
          else
            echo "version-type=release" >> "$GITHUB_OUTPUT"
          fi

      - name: Build every supported Minecraft version
        env:
          MOD_VERSION: ${{ steps.release.outputs.version }}
        run: ./gradlew buildAndGather "-Pmod_version=$MOD_VERSION" --stacktrace

      - name: List release jars
        shell: bash
        run: find build/release -maxdepth 1 -type f -name '*.jar' -print | sort

      - name: Attach jars to the GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" build/release/*.jar --clobber

      - name: Save jars for publishing jobs
        uses: actions/upload-artifact@v4
        with:
          name: release-jars
          path: build/release/*.jar
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish Minecraft ${{ matrix.minecraft }}
    needs: [validate, build]
    runs-on: ubuntu-latest
    # Publish sequentially to avoid API rate limits and featured-version races.
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(needs.validate.outputs.release-matrix) }}
    steps:
      - name: Download release jars
        uses: actions/download-artifact@v4
        with:
          name: release-jars
          path: build/release

      - name: Publish to Modrinth and CurseForge
        uses: Kira-NT/mc-publish@v3.3.1
        with:
          modrinth-id: ${{ vars.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          files: build/release/teamcraft-${{ needs.build.outputs.version }}-fabric-${{ matrix.fabric_api }}-mc.jar
          name: TeamCraft ${{ needs.build.outputs.version }} for Minecraft ${{ matrix.minecraft }}
          version: ${{ needs.build.outputs.version }}+mc${{ matrix.minecraft }}
          version-type: ${{ needs.build.outputs.version-type }}
          loaders: fabric
          game-versions: ${{ matrix.minecraft }}
          game-version-filter: none
          environment: client | server
          java: ${{ matrix.java }}
          dependencies: fabric-api(required){modrinth:P7dR8mSH}{curseforge:306612}
          retry-attempts: 3
          retry-delay: 10000
          fail-mode: fail
